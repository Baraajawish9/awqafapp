{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme-scope="dashboard">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}لوحة إدارة الأوقاف{% endblock %}</title>
    <script>(function(){try{var s=document.documentElement.dataset.themeScope||'global';var t=localStorage.getItem('awqaf-theme:'+s);if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
    <link rel="stylesheet" href="{% static 'screen/ui.css' %}?v=contact-page-1">
    <script defer src="{% static 'screen/theme.js' %}?v=theme-2"></script>
</head>
<body>
    <div class="app-shell">
        <header class="app-topbar">
            <div class="brand">
                <span class="brand-title">نظام إدارة اختبار الأجزاء</span>
                <span class="brand-subtitle">وزارة الأوقاف</span>
            </div>
            <nav class="nav-actions" aria-label="التنقل الرئيسي">
                <a class="nav-link" href="{% url 'add_student' %}">إدارة الطلاب</a>
                <a class="nav-link" href="{% url 'public_screen' %}">الشاشة العامة</a>
                <a class="nav-link" href="{% url 'edit_settings' %}">الإعدادات</a>
                <a class="nav-link" href="{% url 'contact' %}">تواصل معنا</a>
                <form class="logout-form" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-button">تسجيل الخروج</button>
                </form>
            </nav>
        </header>

        <main class="page">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
